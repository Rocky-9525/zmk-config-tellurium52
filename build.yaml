---
# ZMK安定版(v0.3-branch)に合わせ、ボード名を seeeduino_xiao_ble に戻している。
# (xiao_ble//zmk は開発版の新しい記法)
include:
  - board: seeeduino_xiao_ble
    shield: settings_reset

  # --- 通常版(こちらを使う) ---
  # チャーリープレックスの空回りでCPUを食い潰し、ペアリングの鍵計算が
  # 30秒のタイムアウトに間に合っていなかった問題の修正入り(.conf参照)。
  # 親機には ZMK Studio の USBシリアル経路を足す。Bluetooth経路は既定で
  # 有効なので、USBでもBluetoothでもStudioに繋がる。
  - board: seeeduino_xiao_ble
    shield: tellurium52_L
    snippet: studio-rpc-usb-uart
  - board: seeeduino_xiao_ble
    shield: tellurium52_R

  # --- 予備: 幽霊キーが再発した場合 ---
  # 待ち時間を実績の500µsに戻し、ワークキューの優先度修正だけで戦う版。
  # 電気的なタイミングは以前とまったく同じなので幽霊キーは出ない。
  - board: seeeduino_xiao_ble
    shield: tellurium52_L
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BEFORE_INPUTS=500 -DCONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BETWEEN_OUTPUTS=500
    artifact-name: tellurium52_L-500
  - board: seeeduino_xiao_ble
    shield: tellurium52_R
    cmake-args: -DCONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BEFORE_INPUTS=500 -DCONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BETWEEN_OUTPUTS=500
    artifact-name: tellurium52_R-500

  # --- ログ版(修正が効いたか数字で確かめる用) ---
  # bt_smp_pkey_ready が何秒で出るかを見る。10秒前後なら修正成功。
  # v0.3 では CONFIG_ZMK_USB_LOGGING を .conf に書くとビルドが通らないため
  # 公式の zmk-usb-logging スニペットを使う(CDC-ACMのノードごと追加される)。
  - board: seeeduino_xiao_ble
    shield: tellurium52_L
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_BT_SMP_LOG_LEVEL_DBG=y
    artifact-name: tellurium52_L-LOG
  - board: seeeduino_xiao_ble
    shield: tellurium52_R
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_BT_SMP_LOG_LEVEL_DBG=y
    artifact-name: tellurium52_R-LOG
