# 【左手 = 親機(Central)】PCとBluetoothで繋がるのはこちら。
# 左手は一貫して安定動作しているため、接続処理を任せる側にした。
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# 親機は「ホスト」と「右手」の2接続を同時に維持する必要がある。
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# ZMK Studioを有効にする
CONFIG_ZMK_STUDIO=y
# ロックを最初から解除しておく(繋がりやすくするため)
CONFIG_ZMK_STUDIO_LOCKING=n

# ロータリーエンコーダー(ダイヤル)を有効にする
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# マウス機能(エンコーダーのスクロール/クリックで使用)
CONFIG_ZMK_MOUSE=y

# 省電力設定
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetoothの出力(+8dBm = nRF52840の上限)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 【重要】BT_MAX_CONN / BT_MAX_PAIRED / ZMK_BLE_EXPERIMENTAL_CONN は
# 推測で追加したが効果が無く、左右が繋がらない原因の疑いがあるため削除。
# ZMKの既定値に任せる。

# USB経由のログ出力は無効化する。
# デバッグログは処理が重く、4700件以上のログ落ちが発生していた。
# スクロールは「時間をかけて移動量を積算する」処理なので、
# ログ出力に処理を奪われると積算前に解除されて動かなくなる。
# 左手が分割用UUID(00000000-0096-7107-...)で広告していることは
# nRF Connect で確認済み。ログは不要なので無効に戻す。
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_DEFAULT_LEVEL=3
# CONFIG_ZMK_LOG_LEVEL_DBG=y

# チャーリープレックスのスキャン待ち時間。
# 直前に駆動した線の電荷が抜けきってから次を読むために十分な時間を取る。
# 9本スキャンでも1周約9msなので実用上問題ない。
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BEFORE_INPUTS=500
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BETWEEN_OUTPUTS=500
