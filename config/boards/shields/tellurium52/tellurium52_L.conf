# 【検証用・一時的に入れ替え】左手側 = 親機(Central)
# 左手を単独でPCに繋いでマトリクスを確認するため。後で n に戻します。
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# ZMK Studioを有効にする
CONFIG_ZMK_STUDIO=y
# ロックを最初から解除しておく(繋がりやすくするため)
CONFIG_ZMK_STUDIO_LOCKING=n

# ロータリーエンコーダー(ダイヤル)を有効にする(マトリクス検証のため一時的にコメントアウト)
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# マウス機能(エンコーダーのスクロール/クリックで使用)
CONFIG_ZMK_MOUSE=y

# 省電力設定
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetoothの出力を少し上げる
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# USB経由のログ出力(切り分け実験のため復活)
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ZMK_LOG_LEVEL_DBG=y

# 【再検証】6本+スイッチ1個の綺麗な状態で、待ち時間を延ばして幽霊が消えるか確認する。
# 前回1000usを試した時はログを切っていたため、幽霊の有無を確認できていなかった。
# 6本なので1スキャン約12msに収まり、ログも出せるはず。
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BEFORE_INPUTS=1000
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BETWEEN_OUTPUTS=1000
