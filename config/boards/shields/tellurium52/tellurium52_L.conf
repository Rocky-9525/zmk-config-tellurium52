# 【左手 = 親機(Central)】PCとBluetoothで繋がるのはこちら。
# 役割は Kconfig.defconfig で指定しているのでここでは重複させない。
# (実績のある配布設定 moNa2 v2 もこの方式)

# ZMK Studio は通信経路(studio-rpc-usb-uart スニペット)が必須。
# 今はログを見るためスニペットを外しているので、Studioも無効にしておく。
# 左右の接続が確立したら、スニペットと一緒に復活させる。
# CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=n

# ロータリーエンコーダー
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# マウス/ポインティング機能(エンコーダーのクリックで使用)
# v0.3 では CONFIG_ZMK_MOUSE ではなく CONFIG_ZMK_POINTING
CONFIG_ZMK_POINTING=y

# バッテリー残量の報告(子機の残量も取得する)
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# 接続間隔の希望値。moNa2 v2 と同じ設定。
# ログで Latency: 30 と極端な値になっていたため明示する。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# 省電力設定
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# 【一時的】親機の動作を確認するためログを有効化。
# 左右の接続が確立できたら必ずコメントアウトに戻すこと。
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ZMK_LOG_LEVEL_DBG=y

# チャーリープレックスの待ち時間。残留電荷による誤検出を防ぐ実績値。
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BEFORE_INPUTS=500
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BETWEEN_OUTPUTS=500

# 以下は推測で追加したが効果が無かったため削除した:
#   CONFIG_BT_MAX_CONN / CONFIG_BT_MAX_PAIRED
#   CONFIG_ZMK_BLE_EXPERIMENTAL_CONN
#   CONFIG_BT_CTLR_TX_PWR_PLUS_8
# 実績のある配布設定(LisM / moNa2 v2)はいずれも指定していない。
