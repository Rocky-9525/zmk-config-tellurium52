# 【検証用・一時的に入れ替え】左手側 = 親機(Central)
# 左手を単独でPCに繋いでマトリクスを確認するため。後で n に戻します。
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# ZMK Studioを有効にする
CONFIG_ZMK_STUDIO=y
# ロックを最初から解除しておく(繋がりやすくするため)
CONFIG_ZMK_STUDIO_LOCKING=n

# ロータリーエンコーダー(ダイヤル)を有効にする(マトリクス検証のため一時的にコメントアウト)
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# マウス機能(エンコーダーのスクロール/クリックで使用)
CONFIG_ZMK_MOUSE=y

# 省電力設定
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetoothの出力を少し上げる
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# USB経由のログ出力(デバッグ用)
# 待ち時間を延ばすとログが出せなくなるため、今回はログを切って「実際に打って」確認する
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_DEFAULT_LEVEL=3
# CONFIG_ZMK_LOG_LEVEL_DBG=y

# 【本命の修正】スキャンの待ち時間を大幅に延長
# Col1(D6)は10個のスイッチがぶら下がる最も長い配線で、静電容量が大きい。
# 内蔵プルダウンは約13kΩと弱いため、40usでは電荷が抜けきらず誤検出していた。
# 出力駆動後、入力を読むまでを 40us -> 1000us に延長して確実に安定させる。
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BEFORE_INPUTS=1000
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BETWEEN_OUTPUTS=250
