# 【左手 = 親機(Central)】PCとBluetoothで繋がるのはこちら。
# 役割は Kconfig.defconfig で指定しているのでここでは重複させない。
# (実績のある配布設定 moNa2 v2 もこの方式)

# ZMK Studio は通信経路(studio-rpc-usb-uart スニペット)が必須。
# 今はログを見るためスニペットを外しているので、Studioも無効にしておく。
# 左右の接続が確立したら、スニペットと一緒に復活させる。
# CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=n

# ロータリーエンコーダー
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# マウス/ポインティング機能(エンコーダーのクリックで使用)
# v0.3 では CONFIG_ZMK_MOUSE ではなく CONFIG_ZMK_POINTING
CONFIG_ZMK_POINTING=y

# バッテリー残量の報告(子機の残量も取得する)
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# 接続間隔の希望値。moNa2 v2 と同じ設定。
# ログで Latency: 30 と極端な値になっていたため明示する。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# 省電力設定
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ログについて:
# v0.3 では CONFIG_ZMK_USB_LOGGING=y をここに書くとビルドが失敗する。
#   warning: USB_CDC_ACM ... has direct dependencies ... with value n,
#            but is currently being y-selected by ZMK_USB_LOGGING
#   error: Aborting due to Kconfig warnings
# CDC-ACM の devicetree ノードが無いのが原因なので、公式スニペット
# (build.yaml の zmk-usb-logging) を使う。こちらには何も書かない。

# チャーリープレックスの待ち時間。
# 【重要】この待ちは k_busy_wait() = CPUを回し続けて待つ実装。
# 9本のピンを1周するたびに 9×(前+後) だけCPUを占有し、待機時のスキャン
# 間隔は10msしかないため、500/500 では 9ms/10ms = CPUの90%を空回りで
# 食い潰していた。その結果ペアリングの鍵計算(ECDH)が68〜101秒かかり、
# SMPの30秒タイムアウトに間に合わず左右の接続が永久に失敗していた。
# 150/150 なら1周2.7ms。内部プルダウン13kΩ×配線容量では時定数1µs程度
# なので、150µsでも150倍の余裕がある。
# スキャン間隔そのものは tellurium52.dtsi の poll-period-ms で広げている。
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BEFORE_INPUTS=150
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BETWEEN_OUTPUTS=150

# 補足: CONFIG_SYSTEM_WORKQUEUE_PRIORITY を割り込み可能な値にして鍵計算に
# 追い越させる手も試したが、Bluetoothが範囲を [-256, -1] に制限しており
# 拒否される(協調的優先度でなければならない)。スキャン側で解決するしかない。

# 以下は推測で追加したが効果が無かったため削除した:
#   CONFIG_BT_MAX_CONN / CONFIG_BT_MAX_PAIRED
#   CONFIG_ZMK_BLE_EXPERIMENTAL_CONN
#   CONFIG_BT_CTLR_TX_PWR_PLUS_8
# 実績のある配布設定(LisM / moNa2 v2)はいずれも指定していない。
