# 【右手 = 子機(Peripheral)】左手の親機とBluetoothで繋がる。
# 役割は Kconfig.defconfig で指定しているのでここでは重複させない。
# 子機側は指定を最小限にする(実績のある配布設定 moNa2 v2 と同じ方針)。

# ロータリーエンコーダー
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ポインティング機能。keymap は左右で共通なので、&msc(マウスホイール)を
# 使う以上こちら側にも入れておかないと子機のビルドで詰む可能性がある。
# (&msc を参照すると msc_input_listener ノードも一緒に有効になるため)
CONFIG_ZMK_POINTING=y

# --- DYA Studio 連携モジュール (dyaブランチのみ) ---
CONFIG_SETTINGS=y

# 【重要】runtime-sensor-rotate は子機に入れてはいけない。
# ビルド#205 のリンクエラー:
#   behavior_runtime_sensor_rotate.c:376:
#     undefined reference to `zmk_behavior_queue_add'
# ZMKはキー処理を親機で行う設計なので、子機ではビヘイビア実行の仕組み
# (behavior_queue)をビルドしない。ZMK標準のビヘイビアは子機側で除外
# されるようになっているが、このモジュールはその除外をしていないため
# 子機で有効にすると必ずリンクで落ちる。
# 右エンコーダは「回転の検出が子機・実際の動作は親機」なので、
# 子機側で切っても機能に影響しない。
# CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y

# スリープ時間の設定を親機と同期させるために子機にも入れる。
CONFIG_ZMK_SETTINGS_RPC=y

# バッテリー残量の報告
CONFIG_ZMK_BATTERY_REPORTING=y

# 省電力設定。休止に入るまで30分。左手と同じ値にしておく。
# (深い休止は SYSTEM OFF なので復帰は再起動扱い。左右で値がずれると
#  片方だけ先に寝てしまい、復帰待ちが二重になる)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# チャーリープレックスの待ち時間。
# 【重要】この待ちは k_busy_wait() = CPUを回し続けて待つ実装。
# 9本のピンを1周するたびに 9×(前+後) だけCPUを占有し、待機時のスキャン
# 間隔は10msしかないため、500/500 では 9ms/10ms = CPUの90%を空回りで
# 食い潰していた。その結果ペアリングの鍵計算(ECDH)が68〜101秒かかり、
# SMPの30秒タイムアウトに間に合わず左右の接続が永久に失敗していた。
# 150/150 なら1周2.7ms。内部プルダウン13kΩ×配線容量では時定数1µs程度
# なので、150µsでも150倍の余裕がある。
# スキャン間隔そのものは tellurium52.dtsi の poll-period-ms で広げている。
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BEFORE_INPUTS=150
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BETWEEN_OUTPUTS=150

# 補足: CONFIG_SYSTEM_WORKQUEUE_PRIORITY を割り込み可能な値にして鍵計算に
# 追い越させる手も試したが、Bluetoothが範囲を [-256, -1] に制限しており
# 拒否される(協調的優先度でなければならない)。スキャン側で解決するしかない。

# ログは無効。子機側のログ出力は不安定なうえ処理を圧迫するため。
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_DEFAULT_LEVEL=3
# CONFIG_ZMK_LOG_LEVEL_DBG=y
