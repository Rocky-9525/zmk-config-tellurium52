# 【右手 = 子機(Peripheral)】左手の親機とBluetoothで繋がる。
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# 【SMP Timeout の切り分け】子機を最小構成にする。
# 鍵交換(SMP)に子機が30秒間まったく応答しないため、他の処理が
# 邪魔をしていないかを確かめる。ペアリングが通ったら1つずつ戻す。
#
# ZMK Studio: 親機だけにあればよい
# CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=n
#
# エンコーダ: この個体は信号が暴れており(val1 が +4/-4 を往復)、
#             処理を占有して応答を妨げている疑いがある
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
#
# マウス機能: 子機側では不要
# CONFIG_ZMK_MOUSE=y
#
# 省電力: ペアリング中に省電力に入る可能性を排除する
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetoothの出力(+8dBm = nRF52840の上限)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 接続パラメータの最適化(左右で揃える)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ログは無効。子機側のログ出力は不安定なうえ処理を圧迫するため。
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_DEFAULT_LEVEL=3
# CONFIG_ZMK_LOG_LEVEL_DBG=y

# チャーリープレックスの待ち時間(左手と同じ実績値)
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BEFORE_INPUTS=500
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BETWEEN_OUTPUTS=500
