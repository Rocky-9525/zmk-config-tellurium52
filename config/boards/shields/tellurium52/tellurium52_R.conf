# 【右手 = 親機(Central)】PCとBluetoothで繋がるのはこちら。
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# ZMK Studioを有効にする
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ロータリーエンコーダーを有効化
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# マウス機能
CONFIG_ZMK_MOUSE=y

# 省電力設定
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetoothの出力(+8dBm = nRF52840の上限)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 【接続枠】親機は「ホスト」と「左手」の2接続を同時に維持する必要がある。
# 実測での相関:
#   #174-#177 (この設定あり) -> split_central_device_found が出ていた(探索していた)
#   #181-#183 (この設定なし) -> 探索ログが一切出ない(左手を探しに行かない)
# 枠が足りず左手用の接続を確保できていないと判断し復活させる。
# なお #174-#177 で接続が切れていた原因は幽霊イベントであり、この設定ではない。
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# 【一時的】左手を発見・接続できているか確認するためログを有効化。
# 左手が分割用UUIDで広告していることは nRF Connect で確認済みなので、
# 右手側が「見つけているのに繋がらない」のか「見つけられない」のかを切り分ける。
# 確認が終わったら必ずコメントアウトに戻すこと。
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ZMK_LOG_LEVEL_DBG=y

# 【重要】チャーリープレックスの待ち時間。
# 直前に駆動した線の残留電荷が抜けきってから次を読む。
# 左手ではこの値で幽霊イベントが完全に消えた。
# 左手で実績のある500usに戻す。1000usは反応が遅くなる原因になり得る。
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BEFORE_INPUTS=500
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BETWEEN_OUTPUTS=500
