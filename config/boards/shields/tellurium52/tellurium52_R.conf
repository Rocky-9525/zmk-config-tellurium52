# 【右手 = 子機(Peripheral)】左手の親機とBluetoothで繋がる。
# 役割は Kconfig.defconfig で指定しているのでここでは重複させない。
# 子機側は指定を最小限にする(実績のある配布設定 moNa2 v2 と同じ方針)。

# ロータリーエンコーダー
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# バッテリー残量の報告
CONFIG_ZMK_BATTERY_REPORTING=y

# 省電力設定
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# チャーリープレックスの待ち時間。
# 【重要】この待ちは k_busy_wait() = CPUを回し続けて待つ実装。
# 9本のピンを1周するたびに 9×(前+後) だけCPUを占有し、待機時のスキャン
# 間隔は10msしかないため、500/500 では 9ms/10ms = CPUの90%を空回りで
# 食い潰していた。その結果ペアリングの鍵計算(ECDH)が68〜101秒かかり、
# SMPの30秒タイムアウトに間に合わず左右の接続が永久に失敗していた。
# 150/150 なら 2.7ms/10ms = 27%。内部プルダウン13kΩ×配線容量では
# 時定数1µs程度なので、150µsでも150倍の余裕がある。
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BEFORE_INPUTS=150
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BETWEEN_OUTPUTS=150

# 上の空回りを他のスレッドが追い越せるようにする。
# 既定の -1 は協調的優先度で「一度始まった処理は終わるまで割り込まれない」。
# キースキャンはこのキューで動くため、優先度10で動く鍵計算が待たされていた。
# 12(割り込み可能)に下げれば鍵計算が空回りを追い越せる。
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=12

# ログは無効。子機側のログ出力は不安定なうえ処理を圧迫するため。
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_DEFAULT_LEVEL=3
# CONFIG_ZMK_LOG_LEVEL_DBG=y
