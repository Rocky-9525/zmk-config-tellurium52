# 【右手 = 子機(Peripheral)】左手の親機とBluetoothで繋がる。
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# ZMK Studioを有効にする
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ロータリーエンコーダーを有効化
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# マウス機能
CONFIG_ZMK_MOUSE=y

# 省電力設定
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetoothの出力(+8dBm = nRF52840の上限)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 子機は親機との1接続のみ。接続枠の指定はZMKの既定に任せる。

# ログは無効。処理を圧迫して動作を乱すため通常運用では切っておく。
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_DEFAULT_LEVEL=3
# CONFIG_ZMK_LOG_LEVEL_DBG=y

# 【重要】チャーリープレックスの待ち時間。
# 直前に駆動した線の残留電荷が抜けきってから次を読む。
# 左手ではこの値で幽霊イベントが完全に消えた。
# 左手で実績のある500usに戻す。1000usは反応が遅くなる原因になり得る。
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BEFORE_INPUTS=500
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BETWEEN_OUTPUTS=500
