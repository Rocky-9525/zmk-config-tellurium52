# 【右手 = 親機(Central)】PCとBluetoothで繋がるのはこちら。
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# ZMK Studioを有効にする
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ロータリーエンコーダーを有効化
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# マウス機能
CONFIG_ZMK_MOUSE=y

# 省電力設定
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetoothの出力(+8dBm = nRF52840の上限)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 【接続が即切れる対策】親機は「PC/スマホ」と「左手」の2つを同時に維持する必要がある。
# 接続枠が足りないと、左手と繋がった瞬間にホスト側が切断される。余裕を持たせる。
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# 接続パラメータの最適化。分割キーボードの接続安定化に効くとされる設定。
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# デバッグログは無効。ログ出力は処理を圧迫し、スキャンの時間精度を乱して
# かえって誤検出を増やすため、通常運用では必ず切っておく。
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_DEFAULT_LEVEL=3
# CONFIG_ZMK_LOG_LEVEL_DBG=y

# 【重要】チャーリープレックスの待ち時間。
# 直前に駆動した線の残留電荷が抜けきってから次を読む。
# 左手ではこの値で幽霊イベントが完全に消えた。
# 右手は放置中でも幽霊イベントが出たため、左手(500)より長めに取る。
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BEFORE_INPUTS=1000
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BETWEEN_OUTPUTS=1000
